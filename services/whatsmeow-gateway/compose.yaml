services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - device-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:?required}@postgres:5432/gateway?sslmode=disable
      GATEWAY_ID: ${GATEWAY_ID:?required}
      GATEWAY_SESSION_ID: ${GATEWAY_SESSION_ID:?required}
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:?required}
      GATEWAY_CALLBACK_URL: ${GATEWAY_CALLBACK_URL:?required}
      GATEWAY_CALLBACK_SECRET: ${GATEWAY_CALLBACK_SECRET:?required}
      GATEWAY_PAYLOAD_ENCRYPTION_KEY: ${GATEWAY_PAYLOAD_ENCRYPTION_KEY:?required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  device-data:
